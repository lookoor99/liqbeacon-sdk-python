[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liqbeacon"
dynamic = ["version"]
description = "Verify Liqbeacon webhooks, detect missed events, and recover them through the API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lookoor99", email = "lookoor99@gmail.com" }]
keywords = ["cardano", "webhook", "utxo", "blockchain", "events"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://liqbeacon.com"
Repository = "https://github.com/lookoor99/liqbeacon-sdk-python"
Issues = "https://github.com/lookoor99/liqbeacon-sdk-python/issues"

[tool.setuptools.dynamic]
# One source of truth: liqbeacon.__version__.
version = { attr = "liqbeacon.__version__" }

[tool.setuptools.packages.find]
include = ["liqbeacon*"]

[tool.setuptools.package-data]
liqbeacon = ["py.typed"]
